# §9.2 price table, keyed `provider/model`. `cost_usd` is frozen at call time from this
# file, so editing a price later never rewrites history.
#
# A model that is absent is NOT an error: the call proceeds, `cost_usd` is recorded null and
# `PRICE_MISSING` is logged (§9.2, ai AC-8). That is deliberate — a missing price must never
# be the reason an interview stops.
#
# Rates as published 2026-07-29. ai spec Q4 flags a pre-demo re-check; a stale row
# mis-states cost and nothing else.
#
# `unit_kind` values are the db `UnitKind` enum verbatim (`token | second | character`, F02
# schema.prisma) — this value is copied straight onto `llm_calls.unit_kind`, so a friendlier
# spelling here would need a mapping table that can only ever drift out of date.
models:
  openai/gpt-4.1-mini:
    unit_kind: token
    input_per_1m_usd: 0.40
    output_per_1m_usd: 1.60
  openai/gpt-4.1-nano:
    unit_kind: token
    input_per_1m_usd: 0.10
    output_per_1m_usd: 0.40
  google/gemini-2.5-flash:
    unit_kind: token
    input_per_1m_usd: 0.30
    output_per_1m_usd: 2.50
  # Voice is metered per minute but recorded in seconds — `per_minute_usd / 60` is the
  # per-unit rate. The `voice`/`worker` ledgers reconcile real usage against this row
  # (§3.5); it is listed here because §9.2 is repo-wide.
  # S05 removes this row: speech (S04) meters TTS/STT against the two rows below, and the
  # convai reconciliation that bills `conversational` is deleted in S05.
  elevenlabs/conversational:
    unit_kind: second
    input_per_1m_usd: 0
    output_per_1m_usd: 0
    per_minute_usd: 0.10
  # Speech TTS is billed per character (S04, speech spec Cost table). `input_per_1m_usd` is the
  # rate per 1M characters spoken; `units`/`unit_kind` on the row are `characters`/`character`.
  elevenlabs/tts:
    unit_kind: character
    input_per_1m_usd: 180.00
    output_per_1m_usd: 0
  # Speech STT (Scribe) is billed per second of audio: `per_minute_usd / 60` per second, the
  # same shape voice reconciliation uses. Row records `units`/`unit_kind` = seconds/`second`.
  elevenlabs/stt:
    unit_kind: second
    input_per_1m_usd: 0
    output_per_1m_usd: 0
    per_minute_usd: 0.006667
