name: interviewly
services:
  db:
    ports: ["5432:5432"]
  cache:
    ports: ["6380:6379"]
  bucket:
    ports: ["9000:9000"]
  mail:
    ports: ["8025:8025"]     # Mailpit web inbox — where verification/reset links are read
  api:
    ports: ["4000:4000"]
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://edge:80
    depends_on:
      edge:
        condition: service_started
