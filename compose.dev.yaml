name: interviewly
services:
  db:
    ports: ["5432:5432"]
  cache:
    ports: ["6380:6379"]
  bucket:
    ports: ["9000:9000"]
  mail:
    ports: ["8025:8025"]     # Mailpit web inbox — where verification/reset links are read
  api:
    # Loopback-only: a bare "4000:4000" binds 0.0.0.0, and `trust proxy 1` (issue 068) then
    # honours an X-Forwarded-For from anything on the LAN that reaches this port directly.
    ports: ["127.0.0.1:4000:4000"]
