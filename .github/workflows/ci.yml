name: CI
on:
  pull_request:
  # Not for the checks — master needs its own run so `actions/setup-node`'s npm cache gets
  # written at refs/heads/master. A cache saved on a PR ref is readable only by that PR, so
  # without this every PR job installs cold, forever.
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # commitlint walks base..HEAD, so the shallow default clone is not enough.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run lint
      # PR-only: on a push event there is no base.sha, and the range would be empty.
      - if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --prefer-offline --no-audit --fund=false
      # @prisma/client hoists to the workspace root, where its postinstall finds no schema
      # and emits a stub client. Without this every Prisma type is missing (F02).
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - run: npm run -w @interviewly/types build
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  compose-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # compose.yaml declares `env_file: [.env]`, which is gitignored.
      - run: cp .env.example .env
      - run: docker compose config

  migrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --prefer-offline --no-audit --fund=false
      - name: migrate-check
        # Step-level env, not a command prefix: the prefix only reached `migrate deploy`
        # and `migrate diff` then failed to resolve env("DATABASE_URL") (P1012).
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow
        run: |
          cd backend
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      # env.ts process.exit(1)s at import on a missing key (F03). `npm test` loads .env via
      # node --env-file-if-exists; vitest's own dotenv handling worked locally but not here.
      - run: cp .env.example .env
      # One vitest run over the whole tree. `--passWithNoTests` is deliberately gone (I01):
      # it made this job green on an empty repo, which is worse than no job at all.
      - run: npm test

  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow
      REDIS_URL: redis://localhost:6379
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - run: cd backend && npx prisma migrate deploy
      # I03: acceptance now imports backend/src/app.ts, which needs the full env schema.
      # Same one-liner build/compose-check already use; job-level env above still wins for
      # DATABASE_URL/SHADOW_DATABASE_URL/REDIS_URL (cucumber.js's loadEnvFile fills the rest).
      - run: cp .env.example .env
      # Blocking again as of I04: question_generation @AC-7/@AC-1 are wired and the whole
      # suite is defined, so an undefined or failing step is a real regression now.
      #
      # Both profiles, explicitly. `test:acceptance` is the `default` profile only, so for two
      # commits after I01 the auth ring was not executed by anything and this job stayed green
      # regardless (auth STATE.md, BLOCKER-2). A new ring must be added here or it is not run.
      - run: npm run test:acceptance
      - run: npx cucumber-js -p auth

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Non-blocking: `next` itself carries a high advisory whose fixed version has not been
      # released yet (vulnerable range 9.3.4-canary.0 - 16.3.0-preview.7, latest stable is
      # 16.2.12). Findings stay visible in the log. Flip back to blocking once next ships the
      # fix — foundations backlog, "npm audit is non-blocking".
      - run: npm audit --audit-level=high
        continue-on-error: true
